name: Verify

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Install pinned pnpm
        run: |
          npm install --global pnpm@12.3.4 --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((pnpm --version).Trim() -ne '12.3.4') { throw 'Unexpected pnpm version' }
      - name: Prepare encrypted public GitHub read credential
        env:
          DSH_CI_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "import { GitHubCredentials } from './src/sources/github-credentials.mjs'; await new GitHubCredentials('artifacts/private/github-token.dpapi').save(process.env.DSH_CI_READ_TOKEN);"
      - name: Run the repository verification gate
        run: npm run verify
